<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0" />
    <title>Quote generator app</title>
    <script src="quotes.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="slide-bar">
      <label class="switch">
        <input id="toggle-btn" type="checkbox" aria-label="auto button" />
        <span class="slider round"></span>
      </label>
    </div>
    <div id="poster">
      <p id="quote"></p>
      <p id="author"></p>
      <div id="button-field">
        <button type="button" id="new-quote">New quote</button>
      </div>
      <div id="display-notice">
        <p id="auto-play-notice" style="display: none">Auto-Play: On</p>
      </div>
    </div>
    <form id="add-new-quote-form">
      <div id="user-input-field">
        <label for="quote-input">Add new quote:</label>
        <input
          name="quote-input"
          type="text"
          id="quote-input"
          value=""
          required
        />
        <label for="author-input">Add new author:</label>
        <input
          name="author-input"
          type="text"
          id="author-input"
          value=""
          required
        />
      </div>
      <br />
      <div id="form-button-field">
        <button type="reset" id="quote-reset-button">Reset</button>
        <button type="submit" id="quote-submit-button">Submit</button>
      </div>
    </form>
  </body>
</html>
